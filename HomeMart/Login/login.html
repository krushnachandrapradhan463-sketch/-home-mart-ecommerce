<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Mart - Login</title>
<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        height: 100%;
        width: 100%;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        position: relative;
        background: #33415c;
    }

    .container {
        background: #fff;
        padding: 30px;
        border-radius: 10px;
        width: 300px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        position: relative;
        z-index: 1;
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #4facfe;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background: #007bff;
    }

    .forgot {
        text-align: right;
        margin-top: 10px;
    }

    .forgot a {
        text-decoration: none;
        color: #007bff;
        font-size: 14px;
    }

    .forgot a:hover {
        text-decoration: underline;
    }

    .register-link {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
    }

</style>
</head>

<body>

<div class="container">
    <h2>Login</h2>

    <form id="form_container">
        <input type="email" placeholder="Enter Email" id="email" required>
        <input type="password" placeholder="Enter Password" id="password" required>

        <button type="submit">Login</button>

        <div class="forgot">
            <a href="#">Forgot Password?</a>
        </div>
        <div class="register-link">
            Don't have an account? <a href="../Registration/registation.html">Register</a>
        </div>
    </form>
</div>
<script src="./login.js"></script>

</body>
</html>
